<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="orb-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>

    <style>
      .beacon {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .orbit-cyan {
        animation: floatCyan 8s ease-in-out infinite alternate;
      }
      .orbit-purple {
        animation: floatPurple 10s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 8;
        animation: dash 25s linear infinite;
      }
      .card-float {
        animation: cardFloat 4s ease-in-out infinite alternate;
      }
      .card-float-delayed {
        animation: cardFloat 4.5s ease-in-out infinite alternate;
        animation-delay: -2s;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes floatCyan {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(40px, -20px) scale(1.15); }
      }
      @keyframes floatPurple {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-30px, 25px) scale(1.2); }
      }
      @keyframes cardFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        100% { opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Animated Glowing Ambience Orbs (Kept in background) -->
  <g class="orbit-cyan">
    <circle cx="200" cy="120" r="220" fill="url(#orb-cyan)" />
  </g>
  <g class="orbit-purple">
    <circle cx="1020" cy="280" r="260" fill="url(#orb-violet)" />
  </g>
  <circle cx="600" cy="380" r="200" fill="url(#orb-emerald)" opacity="0.4" />

  <!-- Grid overlay -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Wave Streamlines (Underneath foreground content) -->
  <g opacity="0.45">
    <path class="wave-line" d="M -100 320 Q 250 220 500 330 T 1100 280 T 1300 320" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="wave-line" d="M -100 350 Q 300 390 650 290 T 1150 360 T 1350 300" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="wave-line" d="M -100 120 Q 350 60 750 140 T 1300 90" fill="none" stroke="#10b981" stroke-width="1.5" />
  </g>

  <!-- Foreground Content: Guaranteed Full Legibility &amp; Contrast -->
  <g transform="translate(600, 0)">
    <!-- Header Pill / Tag -->
    <g transform="translate(-185, 42)">
      <rect width="370" height="34" rx="17" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="20" cy="17" r="4.5" fill="#38bdf8" class="beacon" />
      <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#bae6fd" letter-spacing="1.5">
        PRODUCTION ML &amp; LLM OBSERVABILITY
      </text>
    </g>

    <!-- Main Title (Never obscured) -->
    <text text-anchor="middle" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">
      Awesome AI Observability
    </text>
    <text text-anchor="middle" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="-0.3">
      &amp; ML Model Evaluation
    </text>

    <!-- Subtitle (Clear foreground) -->
    <text text-anchor="middle" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Landscape of Production Monitoring, RAG Evaluation, OpenTelemetry &amp; Drift Suites
    </text>

    <!-- Interactive / Status Metrics Dynamic Cards -->
    <g transform="translate(-490, 268)">
      <!-- Card 1: Drift & Metrics -->
      <g class="card-float" transform="translate(0, 0)">
        <rect width="225" height="82" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <circle cx="28" cy="28" r="9" fill="#0ea5e9" fill-opacity="0.2" />
        <circle cx="28" cy="28" r="4" fill="#38bdf8" />
        <text x="46" y="32" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">Data &amp; Concept Drift</text>
        <text x="24" y="58" font-family="monospace" font-size="11" fill="#38bdf8">PSI • KS-Test • CBPE</text>
      </g>

      <!-- Card 2: LLM & RAG Evals -->
      <g class="card-float-delayed" transform="translate(250, 0)">
        <rect width="235" height="82" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <circle cx="28" cy="28" r="9" fill="#8b5cf6" fill-opacity="0.2" />
        <circle cx="28" cy="28" r="4" fill="#a855f7" />
        <text x="46" y="32" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">LLM &amp; RAG Evaluation</text>
        <text x="24" y="58" font-family="monospace" font-size="11" fill="#c084fc">Faithfulness • Grounding</text>
      </g>

      <!-- Card 3: OpenTelemetry Tracing -->
      <g class="card-float" transform="translate(510, 0)">
        <rect width="235" height="82" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <circle cx="28" cy="28" r="9" fill="#10b981" fill-opacity="0.2" />
        <circle cx="28" cy="28" r="4" fill="#34d399" />
        <text x="46" y="32" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">OpenTelemetry Traces</text>
        <text x="24" y="58" font-family="monospace" font-size="11" fill="#34d399">Spans • Waterfalls • OTel</text>
      </g>

      <!-- Card 4: Data Quality & Tests -->
      <g class="card-float-delayed" transform="translate(770, 0)">
        <rect width="210" height="82" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
        <circle cx="28" cy="28" r="9" fill="#f59e0b" fill-opacity="0.2" />
        <circle cx="28" cy="28" r="4" fill="#fbbf24" />
        <text x="46" y="32" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">Data Quality Suites</text>
        <text x="24" y="58" font-family="monospace" font-size="11" fill="#fbbf24">Expectations • Profiling</text>
      </g>
    </g>

    <!-- Bottom Tech Tags -->
    <g transform="translate(-320, 382)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" letter-spacing="1">
        ✦ SAAS PLATFORMS &amp; BENCHMARKS &#160;|&#160; ✦ OPEN-SOURCE ECOSYSTEM &#160;|&#160; ✦ PRODUCTION CI/CD GATES
      </text>
    </g>
  </g>
</svg>
